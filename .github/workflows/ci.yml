name: CI Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run a simple test message
        run: echo "Пайплайн успешно запущен и работает!"

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.ru
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI/CD Pipeline Status: ${{ job.status }}"
          to: artemeva.anastasya@inbox.ru
          from: artemeva.anastasya@inbox.ru
          body: |
            Результат выполнения пайплайна: ${{ job.status }}
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref }}