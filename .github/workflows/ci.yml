name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <--- Вот это разрешение решает проблему с лимитами и доступом для релизов
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run a simple test message
        run: echo "Пайплайн успешно запущен и работает!"

      - name: Create build archive
        run: |
          mkdir -p dist
          zip -r dist/app-artifact.zip . -x ".git*" "node_modules/*"

      - name: Release and Upload Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/app-artifact.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.ru
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI/CD Pipeline Status: ${{ job.status }}"
          to: artemeva.anastasya@inbox.ru
          from: artemeva.anastasya@inbox.ru
          body: |
            Результат выполнения пайплайна: ${{ job.status }}
            Репозиторий: ${{ github.repository }}
            Ветка/Тег: ${{ github.ref }}