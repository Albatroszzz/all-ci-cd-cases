name: CI Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run a simple test message
        run: echo "Пайплайн успешно запущен и работает!"

      - name: Send Email Notification
        if: always()
        run: |
          curl --ssl-reqd \
            --url 'smtps://smtp.mail.ru:465' \
            --user '${{ secrets.MAIL_USERNAME }}:${{ secrets.MAIL_PASSWORD }}' \
            --mail-from '${{ secrets.MAIL_USERNAME }}' \
            --mail-rcpt 'artemeva.anastasya@inbox.ru' \
            -T - «EOF
          From: ${{ secrets.MAIL_USERNAME }}
          To: artemeva.anastasya@inbox.ru
          Subject: CI/CD Pipeline Status: ${{ job.status }}

          Результат выполнения пайплайна: ${{ job.status }}
          Репозиторий: ${{ github.repository }}
          Ветка: ${{ github.ref }}
          EOF